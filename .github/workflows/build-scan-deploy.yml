# Runs on every push and on pull requests to main.
# Every run: lint and tests, secret scan, IaC scan, image build and image scan.
# Only on main: push the image to ACR and deploy it to AKS.
name: Build, scan and deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: learningsteps-api
  # Scanner versions are fixed, the same as on my laptop
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog:3.97.9

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r api/requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check api tests
      - name: Tests (pytest)
        run: python -m pytest -q tests

  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      - name: Scan all commits for credentials
        run: |
          docker run --rm -v "$PWD:/tmp/repo" -w /tmp/repo "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/repo \
            --results=verified,unknown \
            --exclude-paths=/tmp/repo/.trufflehog-exclude.txt \
            --fail --no-update

  iac-scan:
    name: IaC scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Terraform, Kubernetes manifests and Dockerfile
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 .

  build:
    name: Build, scan and push image
    needs: [test, secret-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for the OIDC login to Azure
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (tag = short commit ID)
        id: name
        run: echo "image=${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build --pull -t "${{ steps.name.outputs.image }}" .
      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.name.outputs.image }}"
      - name: Log in to Azure (OIDC, no stored password)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "${{ steps.name.outputs.image }}"

  deploy:
    name: Deploy to AKS
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-aks
      cancel-in-progress: false
    steps:
      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The AKS API only accepts my IP, so kubectl runs inside the cluster through Azure
      - name: Set the new image and wait for the rollout
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          result=$(az aks command invoke \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_NAME }}" \
            --command "kubectl -n lsevo set image deployment/api api=$IMAGE && kubectl -n lsevo rollout status deployment/api --timeout=180s" \
            -o json)
          echo "$result" | jq -r '.logs'
          exit "$(echo "$result" | jq -r '.exitCode')"
      - name: Smoke test on the public IP
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.APP_URL }}/health/db"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "The API did not answer /health/db"
          exit 1
