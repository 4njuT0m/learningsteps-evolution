# The LearningSteps API in AKS.
# ${IMAGE}, ${API_CLIENT_ID}, ${KV_NAME} and ${TENANT_ID} are filled in
# with envsubst before applying (image tag and Terraform outputs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lsevo-api
  namespace: lsevo
  annotations:
    azure.workload.identity/client-id: "${API_CLIENT_ID}"
---
# The API pods get only one secret from Key Vault: database-url
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-api
  namespace: lsevo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${API_CLIENT_ID}"
    keyvaultName: "${KV_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
---
# Settings that are not secret. uvicorn reads variables that start with UVICORN_.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: lsevo
data:
  UVICORN_LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lsevo
  labels:
    app: lsevo-api
spec:
  # No replicas here: the HorizontalPodAutoscaler decides how many pods run
  selector:
    matchLabels:
      app: lsevo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lsevo-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: lsevo-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ${IMAGE}
          # The database URL is read from the mounted Key Vault file at start,
          # so it never becomes a Kubernetes Secret
          command: ["sh", "-c"]
          args:
            - export DATABASE_URL="$(cat /mnt/secrets/database-url)" && exec uvicorn main:app --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - name: http
              containerPort: 8000
          # Restart the container if the process stops answering
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          # Send traffic only to pods that can reach the database
          readinessProbe:
            httpGet:
              path: /health/db
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: kv-api
---
# Public entry point: an Azure load balancer with a public IP, port 80 to the pods' port 8000
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lsevo
spec:
  type: LoadBalancer
  selector:
    app: lsevo-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 2 to 4 pods, more when the average CPU use is above 70% of the request
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: lsevo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
